[project]
name = "onnx_benchy"
version = "0.2.0"
description = "Benchmark ONNX embedding models across ONNX Runtime backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "electroglyph" }]
urls = { Homepage = "https://github.com/electroglyph/onnx_benchy" }
dependencies = [
  "onnxruntime>=1.17",
  "transformers>=4.40",
  "tokenizers>=0.19",
  "datasets>=2.18",
  "numpy>=1.26",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.optional-dependencies]
cuda = ["onnxruntime-gpu>=1.17"]
test = ["pytest>=8"]

[project.scripts]
onnx_benchy = "onnx_benchy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx_benchy"]

[tool.ruff]
line-length = 100
target-version = "py310"
